units_validated:
  validated_at: '2026-11-05'
  method: consultas instantaneas no srv-host01 cruzando contadores (soma das VMs + raiz = processadores logicos)
  cpu_time:
    unit: segundos de CPU (rate = CPUs ocupadas)
    metrics:
      - windows_hyperv_hypervisor_logical_processor_total_run_time_total
      - windows_hyperv_hypervisor_logical_processor_time_total
      - windows_hyperv_hypervisor_root_virtual_processor_time_total
      - windows_hyperv_hypervisor_root_virtual_processor_total_run_time_total
      - windows_hyperv_hypervisor_virtual_processor_total_run_time_total
    evidence: rate VMs (1.093) + raiz (0.277) = 1.371 ~ processadores logicos (1.410); guest+hypervisor = run_time
    host_cpu_pct: 100 * sum(rate(windows_hyperv_hypervisor_logical_processor_total_run_time_total[5m])) / count(windows_hyperv_hypervisor_logical_processor_total_run_time_total)
    vm_cpu_pct: 100 * sum by (vm) (rate(windows_hyperv_hypervisor_virtual_processor_total_run_time_total[5m])) / count by (vm) (windows_hyperv_hypervisor_virtual_processor_total_run_time_total)
    caveat: O estado idle nao fecha 100% (soma dos estados 14 de 32 CPUs). Usar run_time / numero de CPUs, nunca 1 - idle.
  windows_root_cpu_on_host:
    finding: windows_cpu_time_total (job integrations/windows) no host Hyper-V mostrou 57% ocupado com o host real em 4%
      e a raiz em 0.9%. A CPU vista pelo Windows do host nao e confiavel; usar os contadores do hypervisor.
  vcpu_count:
    evidence: count by (vm) de virtual_processor = hypervisor_vm_cpus do inventario nas 18 VMs ligadas
  storage_bytes:
    unit: bytes acumulados (contador, apesar do nome sem _total)
    metrics:
      - windows_hyperv_virtual_storage_device_bytes_read
      - windows_hyperv_virtual_storage_device_bytes_written
    evidence: rate 587 KiB/s; bruto 3.9 TB em ~1 semana
  vswitch_bytes:
    unit: bytes acumulados (contador)
    metrics:
      - windows_hyperv_vswitch_bytes_total
    evidence: rate 2.5 Mb/s
  pending:
    - windows_hyperv_hypervisor_virtual_processor_cpu_wait_time_per_dispatch_total (bruto ~60 a 7500, nao parece acumulado)
    - windows_hyperv_virtual_storage_device_latency_seconds (bruto 4.1e11, nao e segundos instantaneos)
query_recipes:
  - id: observed_vm_vcpu_counts
    title: vCPUs observadas por host e VM
    promql: count by (instance, vm) (windows_hyperv_hypervisor_virtual_processor_total_run_time_total{job="integrations/hyperv"})
    unit: count
    dependencies:
      - windows_hyperv_hypervisor_virtual_processor_total_run_time_total
    validation: dependencies_in_export; not_executed
    notes:
      - Conta labels core presentes; nao constitui inventario completo de VMs ligadas/desligadas.
  - id: vm_assigned_memory
    title: Memoria fisica atribuida por VM
    promql: windows_hyperv_dynamic_memory_vm_physical_bytes{job="integrations/hyperv"}
    unit: bytes
    dependencies:
      - windows_hyperv_dynamic_memory_vm_physical_bytes
    validation: dependencies_in_export; not_executed
    notes:
      - Nao rotular como memoria efetivamente utilizada pelo sistema convidado.
  - id: vm_guest_visible_memory
    title: Memoria visivel ao convidado
    promql: windows_hyperv_dynamic_memory_vm_guest_visible_physical_memory_bytes{job="integrations/hyperv"}
    unit: bytes
    dependencies:
      - windows_hyperv_dynamic_memory_vm_guest_visible_physical_memory_bytes
    validation: dependencies_in_export; not_executed
    notes: []
  - id: vm_guest_available_memory
    title: Memoria disponivel informada pelo Hyper-V
    promql: windows_hyperv_dynamic_memory_vm_guest_available_bytes{job="integrations/hyperv"}
    unit: bytes
    dependencies:
      - windows_hyperv_dynamic_memory_vm_guest_available_bytes
    validation: dependencies_in_export; not_executed
    notes:
      - Valores nao comparados ao Alloy instalado dentro da VM.
  - id: network_received_counter
    title: Contador bruto por adapter
    promql: windows_hyperv_virtual_network_adapter_received_bytes_total{job="integrations/hyperv"}
    unit: bytes_counter_reference
    dependencies:
      - windows_hyperv_virtual_network_adapter_received_bytes_total
    validation: dependencies_in_export; not_executed
    notes:
      - Consulta de inspecao. Nao e taxa de trafego e nao agrupa por VM. Confirmar TYPE antes de consolidar receita
        de rate.
  - id: storage_read_vhdx_counter
    title: Valor bruto de leitura em dispositivos VHDX
    promql: windows_hyperv_virtual_storage_device_bytes_read{job="integrations/hyperv",device=~"(?i).*[.]vhdx"}
    unit: unverified_raw_value
    dependencies:
      - windows_hyperv_virtual_storage_device_bytes_read
    validation: dependencies_in_export; not_executed
    notes:
      - Filtro apenas por extensao observada. Confirmar semantica de bytes_read antes de usar rate; nao indica ocupacao
        do disco.
  - id: aggregate_health
    title: Saude agregada por state
    promql: windows_hyperv_virtual_machine_health_total_count{job="integrations/hyperv"}
    unit: unverified_raw_value
    dependencies:
      - windows_hyperv_virtual_machine_health_total_count
    validation: dependencies_in_export; not_executed
    notes:
      - Nao fornece state individual das VMs.
limitations:
  - 18 nomes de VM aparecem em CPU/memoria; isso nao comprova que todas as VMs configuradas, inclusive desligadas,
    estejam representadas.
  - O export possui 143 nomes de metricas no job; 133 com prefixo windows_hyperv e 10 de suporte.
  - Nao foi observada metrica de estado operacional individual da VM nem label vm_id dedicada.
  - Rede e armazenamento nao possuem label vm. Foram preservados adapter e device sem criar relacionamentos por
    regex.
  - '37 dispositivos de armazenamento: 18 com sufixo VHDX, 18 VMGS e uma entrada ISO. Os caminhos nao autorizam
    um join universal com vm.'
  - Memoria por VM tem label vm; CPU tem vm e core. Dados do convidado exigem contrato Linux/Windows e mapeamento.
  - 'Nao foram convertidos contadores de CPU/latencia em percentuais: TYPE, unidade de runtime e amostras nao vieram
    neste export.'
  - A presenca de metricas de memoria dinamica nao confirma a configuracao de memoria de cada VM.
change_policy:
  baseline_counts_are_fixed_requirements: false
  require_new_metrics_before_using_in_dashboard: true
  preserve_raw_labels: true
  alloy_changes_applied: false
query_policy:
  numerically_validated: false
  promql_parser_validation: not_performed
  static_metric_dependencies_checked: true
  documentation_sources:
    - prometheus_functions
  note: As receitas usam semantica padrao onde conhecida; o catalogo preserva a ausencia de TYPE/HELP do exporter
    em execucao.
