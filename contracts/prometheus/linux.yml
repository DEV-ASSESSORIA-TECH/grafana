      - node_disk_write_time_seconds_total
      - node_disk_writes_completed_total
      - node_disk_writes_merged_total
      - node_disk_written_bytes_total
    interpretation: Manter device. Somar sda e dm-0 pode contar o mesmo I/O em camadas diferentes.
  network:
    title: Rede por interface
    metrics_observed:
