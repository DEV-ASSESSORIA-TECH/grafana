name: catalogo

# Os dashboards chegam pelo Git Sync sem build: o filtro de containers ignorados fica escrito no JSON.
# Quando o catalogo.yml muda (inclusive editado pelo GitHub), este workflow regrava os dashboards e
# faz o commit na mesma branch.
on:
  push:
    paths:
      - catalogo.yml
      - dashboards/**
      - scripts/catalogo.py

permissions:
  contents: write

concurrency:
  group: catalogo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-dashboards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Regravar dashboards a partir do catalogo
        run: python scripts/catalogo.py --dashboards
      - name: Commit, se mudou
        run: |
          if git diff --quiet -- dashboards; then
            echo "dashboards ja batem com o catalogo"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboards
          git commit -m "chore(dashboards): sincroniza containers ignorados com o catalogo.yml"
          git push
