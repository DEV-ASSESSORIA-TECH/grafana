# Contrato de notificacao; nao provisionar este YAML no Grafana.
schema_version: 1
kind: alert_notification_contract
version: 0.1.0
id: alert-notifications
title: Contact points e roteamento por severidade
status: defined
scope: >-
  Nomes dos contact points que as policies (alerting/notifications/policies.yaml) podem usar e quem gerencia cada
  um. Os destinatarios nao fazem parte do contrato.
contact_points:
  email-infra:
    managed_by: ui
    type: email
    purpose: Notificacoes critical e warning da infraestrutura.
    note: >-
      Criado e editado na UI do Grafana (destinatarios mudam sem PR). Precisa existir ANTES de aplicar as policies:
      policy com contact point inexistente impede o Grafana de subir.
managed_by:
  ui: Criado e editado pela UI; nunca aparece em alerting/ (o arquivo bloquearia a edicao na UI).
  file: Provisionado por arquivo em alerting/notifications/contact-points.yaml.
routing:
  critical: email-infra, repeticao curta
  warning: email-infra, agrupamento e repeticao longos
  info: email-infra com o mute timing 'sempre' (nunca notifica; o alerta fica visivel no Grafana)
  group_by: [area, dep_hypervisor]
rules:
  - Toda policy referencia apenas contact points deste contrato.
  - Contact point managed_by ui nao pode ser declarado em alerting/.
  - A arvore de policies e um recurso unico; o arquivo substitui a arvore inteira ao ser aplicado.
