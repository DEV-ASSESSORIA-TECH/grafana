# Contrato observado para consumidores de dashboards; nao provisionar este YAML no Grafana.
schema_version: 2
kind: observability_contract
version: 0.3.0
id: docker
title: Docker / metricas cAdvisor
status: observed_baseline
observed_at_utc: '2026-11-04T19:01:53.881Z'
job: integrations/docker
references:
  common: common.yml
identity:
  target_key:
    - job
    - instance
  container_key:
    - job
    - instance
    - id
  container_display_name: name
  image_label: image
  compose_project_label: container_label_com_docker_compose_project
  compose_service_label: container_label_com_docker_compose_service
  network_key:
    - instance
    - id
    - interface
  disk_key:
    - instance
    - id
    - device
  compose_service_alone_is_unique: false
  expected_generic_labels_not_observed:
    - container
    - service
    - node
    - compose_project
    - compose_service
grafana_variables:
  syntax: Grafana label_values, nao PromQL da API
  instance:
    query: label_values(container_last_seen{job="integrations/docker",name!=""}, instance)
    multi: true
    all_value: .*
  project:
    query: label_values(container_last_seen{job="integrations/docker",instance=~"$instance"}, container_label_com_docker_compose_project)
    multi: true
    all_value: .*
  container:
    query: label_values(container_last_seen{job="integrations/docker",instance=~"$instance",container_label_com_docker_compose_project=~"$project"},
      name)
    multi: true
    all_value: .*
metric_groups:
  identity:
    title: Identidade e presenca dos containers
    metrics_observed:
      - container_last_seen
      - container_creation_time_seconds
      - container_start_time_seconds
  cpu:
    title: CPU consumida pelos containers
    metrics_observed:
      - container_cpu_load_average_10s
      - container_cpu_load_d_average_10s
      - container_cpu_system_seconds_total
      - container_cpu_usage_seconds_total
      - container_cpu_user_seconds_total
    interpretation: cpu="total" esta presente em container_cpu_usage_seconds_total. Nao confundir CPU em cores com
      percentual do limite.
  memory:
    title: Memoria dos containers
    metrics_observed:
      - container_memory_cache
      - container_memory_events_high_total
      - container_memory_events_max_total
      - container_memory_failcnt
      - container_memory_failures_total
      - container_memory_file_dirty_bytes
      - container_memory_file_writeback_bytes
      - container_memory_kernel_usage
      - container_memory_mapped_file
      - container_memory_max_usage_bytes
      - container_memory_pgscan_total
      - container_memory_pgsteal_total
      - container_memory_rss
      - container_memory_swap
      - container_memory_total_active_file_bytes
      - container_memory_total_inactive_file_bytes
      - container_memory_usage_bytes
      - container_memory_working_set_bytes
      - container_memory_workingset_refault_anon_total
      - container_memory_workingset_refault_file_total
    interpretation: usage e working_set sao indicadores diferentes; nao sao intercambiaveis. Limites podem estar
      ausentes ou nao representar um limite util.
  network:
    title: Rede por interface do container
    metrics_observed:
      - container_network_receive_bytes_total
      - container_network_receive_errors_total
      - container_network_receive_packets_dropped_total
      - container_network_receive_packets_total
      - container_network_transmit_bytes_total
      - container_network_transmit_errors_total
      - container_network_transmit_packets_dropped_total
      - container_network_transmit_packets_total
  disk_io:
    title: I/O de bloco e filesystem
    metrics_observed:
      - container_blkio_device_usage_total
      - container_fs_reads_bytes_total
      - container_fs_reads_total
      - container_fs_writes_bytes_total
      - container_fs_writes_total
    interpretation: Ha I/O de leitura/escrita, mas container_fs_usage_bytes e container_fs_limit_bytes nao sao publicadas.
  limits:
    title: Especificacoes e limites
    metrics_observed:
      - container_spec_cpu_period
      - container_spec_cpu_shares
      - container_spec_memory_limit_bytes
      - container_spec_memory_reservation_limit_bytes
      - container_spec_memory_swap_limit_bytes
    interpretation: Limites podem faltar em alguns containers; quota de CPU nao e publicada.
  health_and_pressure:
    title: Saude, tarefas, OOM e pressure
    metrics_observed:
      - container_health_state
      - container_oom_events_total
      - container_pressure_cpu_stalled_seconds_total
      - container_pressure_cpu_waiting_seconds_total
      - container_pressure_io_stalled_seconds_total
      - container_pressure_io_waiting_seconds_total
      - container_pressure_memory_stalled_seconds_total
      - container_pressure_memory_waiting_seconds_total
      - container_tasks_state
    interpretation: Health state existe, mas a codificacao numerica nao foi confirmada.
  machine:
    title: Informacoes do host vistas pelo cAdvisor
    metrics_observed:
      - machine_cpu_books
      - machine_cpu_cores
      - machine_cpu_drawers
      - machine_cpu_physical_cores
      - machine_cpu_sockets
      - machine_memory_bytes
      - machine_nvm_avg_power_budget_watts
      - machine_nvm_capacity
      - machine_scrape_error
      - machine_swap_bytes
  collection_health:
    title: Coleta e build
    metrics_observed:
      - up
      - cadvisor_build_info
      - cadvisor_version_info
      - container_scrape_error
      - machine_scrape_error
  other_observed:
    title: Demais metricas observadas
    metrics_observed:
      - scrape_duration_seconds
      - scrape_samples_post_metric_relabeling
      - scrape_samples_scraped
      - scrape_series_added
query_recipes:
  - id: observed_container_identities
    title: Containers representados na metrica last_seen
    promql: count by (instance) (container_last_seen{job="integrations/docker",name!=""})
    unit: count
    dependencies:
      - container_last_seen
    validation: dependencies_in_export; not_executed
    notes:
      - Nao rotular automaticamente como containers running. Inventario de containers parados nao foi comprovado.
  - id: container_cpu_cores
    title: CPU em equivalentes de core
    promql: rate(container_cpu_usage_seconds_total{job="integrations/docker",cpu="total",name!=""}[5m])
    unit: cores
    dependencies:
      - container_cpu_usage_seconds_total
    validation: dependencies_in_export; not_executed
    notes:
      - 'Referencia cAdvisor: contador de segundos de CPU. A taxa pode exceder 1 core; nao e percentual do limite.'
  - id: container_working_set
    title: Working set por container
    promql: container_memory_working_set_bytes{job="integrations/docker",name!=""}
    unit: bytes
    dependencies:
      - container_memory_working_set_bytes
    validation: dependencies_in_export; not_executed
    notes: []
  - id: container_memory_usage
    title: Uso de memoria incluindo cache contabilizado
    promql: container_memory_usage_bytes{job="integrations/docker",name!=""}
    unit: bytes
    dependencies:
      - container_memory_usage_bytes
    validation: dependencies_in_export; not_executed
    notes: []
  - id: container_network_receive
    title: Entrada por interface do container
    promql: 8 * rate(container_network_receive_bytes_total{job="integrations/docker",name!=""}[5m])
    unit: bits_per_second
    dependencies:
      - container_network_receive_bytes_total
    validation: dependencies_in_export; not_executed
    notes: []
  - id: container_network_transmit
    title: Saida por interface do container
    promql: 8 * rate(container_network_transmit_bytes_total{job="integrations/docker",name!=""}[5m])
    unit: bits_per_second
    dependencies:
      - container_network_transmit_bytes_total
    validation: dependencies_in_export; not_executed
    notes: []
  - id: container_disk_reads
    title: Leitura por container e device
    promql: rate(container_fs_reads_bytes_total{job="integrations/docker",name!=""}[5m])
    unit: bytes_per_second
    dependencies:
      - container_fs_reads_bytes_total
    validation: dependencies_in_export; not_executed
    notes:
      - Nao agregar camadas de device sem curadoria.
  - id: container_disk_writes
    title: Escrita por container e device
    promql: rate(container_fs_writes_bytes_total{job="integrations/docker",name!=""}[5m])
    unit: bytes_per_second
    dependencies:
      - container_fs_writes_bytes_total
    validation: dependencies_in_export; not_executed
    notes: []
  - id: container_scrape_error
    title: Erro de coleta de containers
    promql: container_scrape_error{job="integrations/docker"}
    unit: boolean
    dependencies:
      - container_scrape_error
    validation: dependencies_in_export; not_executed
    notes:
      - Up=1 nao basta para garantir ausencia de erros internos do exporter.
limitations:
  - container_last_seen nao distingue containers parados; nao e inventario definitivo de containers.
  - Nao assumir que a ausencia de um container cAdvisor separado elimina o cAdvisor embarcado no Alloy.
  - container_fs_usage_bytes, container_fs_limit_bytes e container_spec_cpu_quota nao sao publicadas.
  - Limites de memoria/CPU nao existem para todos os containers; nao preencher ausencias com zero.
  - Nao inventar mapeamento de container_health_state sem validar a enumeracao da versao em execucao.
  - Os labels Compose de metricas sao longos e diferentes dos labels simplificados usados em logs Loki. Este contrato
    nao cobre logs.
change_policy:
  baseline_counts_are_fixed_requirements: false
  require_new_metrics_before_using_in_dashboard: true
  preserve_raw_labels: true
query_policy:
  numerically_validated: false
  promql_parser_validation: not_performed
  static_metric_dependencies_checked: true
  documentation_sources:
    - prometheus_functions
  note: As receitas usam semantica padrao onde conhecida; o exporter nao publica TYPE/HELP de todas as metricas.
