# Regras de alerta dos servidores Windows (convidados). Codigos em contracts/alerts/codes.yml.
# Labels: escrever $$labels (o provisionamento interpola variaveis de ambiente nos labels).
# Annotations e consultas nao sao interpoladas: nelas, $labels.
# Painel vinculado: annotations __dashboardUid__/__panelId__ (o Grafana ignora os campos dashboardUid/panelId).
apiVersion: 1
groups:
  - orgId: 1
    name: windows-1m
    folder: INFRA
    interval: 1m
    rules:
      - uid: win-101
        title: '[WIN-101] Servidor Windows crítico sem métricas'
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: |-
                (
                  group by (instance) (max_over_time(up{job="integrations/windows",instance=~"srv-ad|srv-ad-trs|srv-contabil-ass|srv-dom-trs|srv-amanda|srv-seven-mtc"}[7d]))
                  unless
                  group by (instance) (up{job="integrations/windows",instance=~"srv-ad|srv-ad-trs|srv-contabil-ass|srv-dom-trs|srv-amanda|srv-seven-mtc"} == 1)
                )
                * on (instance) group_left (vm, hypervisor)
                max by (instance, vm, hypervisor) (
                  label_replace(label_replace(
                    max by (instance, guest_host, vm) (last_over_time(hypervisor_vm_info{job="integrations/hypervisor"}[1h])),
                    "hypervisor", "$1", "instance", "(.+)"), "instance", "$1", "guest_host", "(.+)")
                )
                or
                (
                  group by (instance) (max_over_time(up{job="integrations/windows",instance=~"srv-ad|srv-ad-trs|srv-contabil-ass|srv-dom-trs|srv-amanda|srv-seven-mtc"}[7d]))
                  unless
                  group by (instance) (up{job="integrations/windows",instance=~"srv-ad|srv-ad-trs|srv-contabil-ass|srv-dom-trs|srv-amanda|srv-seven-mtc"} == 1)
                )
                unless on (instance)
                max by (instance, vm, hypervisor) (
                  label_replace(label_replace(
                    max by (instance, guest_host, vm) (last_over_time(hypervisor_vm_info{job="integrations/hypervisor"}[1h])),
                    "hypervisor", "$1", "instance", "(.+)"), "instance", "$1", "guest_host", "(.+)")
                )
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            queryType: expression
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          runbook_url: https://github.com/DEV-ASSESSORIA-TECH/grafana/blob/main/docs/alerts/WIN-101.md
          __dashboardUid__: servers-windows
          __panelId__: "368"
          summary: 'Servidor Windows {{ $labels.instance }} sem métricas'
          description: |-
            O servidor {{ $labels.instance }} (classificado como crítico) parou de enviar métricas há mais de 5 minutos.

            Possíveis causas: servidor desligado ou travado, Grafana Alloy parado, falha de rede até o monitoramento.

            Se a VM ou o hipervisor estiverem fora, este alerta fica inibido pelo alerta deles.
            Servidor desativado de propósito some deste alerta depois de 7 dias (ou silencie).
        labels:
          alert_code: WIN-101
          severity: critical
          area: windows
          scope: guest
          dep_hypervisor: '{{ with $$labels.hypervisor }}{{ . | toLower | reReplaceAll "[^a-z0-9_]" "_" }}{{ end }}'
          dep_vm: '{{ with $$labels.vm }}{{ . | toLower | reReplaceAll "[^a-z0-9_]" "_" }}{{ end }}'
        isPaused: false

      - uid: win-102
        title: '[WIN-102] Servidor Windows sem métricas'
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: |-
                (
                  group by (instance) (max_over_time(up{job="integrations/windows",instance!~"srv-ad|srv-ad-trs|srv-contabil-ass|srv-dom-trs|srv-amanda|srv-seven-mtc|srv-host01|srv-host01-mtc"}[7d]))
                  unless
                  group by (instance) (up{job="integrations/windows",instance!~"srv-ad|srv-ad-trs|srv-contabil-ass|srv-dom-trs|srv-amanda|srv-seven-mtc|srv-host01|srv-host01-mtc"} == 1)
                )
                * on (instance) group_left (vm, hypervisor)
                max by (instance, vm, hypervisor) (
                  label_replace(label_replace(
                    max by (instance, guest_host, vm) (last_over_time(hypervisor_vm_info{job="integrations/hypervisor"}[1h])),
                    "hypervisor", "$1", "instance", "(.+)"), "instance", "$1", "guest_host", "(.+)")
                )
                or
                (
                  group by (instance) (max_over_time(up{job="integrations/windows",instance!~"srv-ad|srv-ad-trs|srv-contabil-ass|srv-dom-trs|srv-amanda|srv-seven-mtc|srv-host01|srv-host01-mtc"}[7d]))
                  unless
                  group by (instance) (up{job="integrations/windows",instance!~"srv-ad|srv-ad-trs|srv-contabil-ass|srv-dom-trs|srv-amanda|srv-seven-mtc|srv-host01|srv-host01-mtc"} == 1)
                )
                unless on (instance)
                max by (instance, vm, hypervisor) (
                  label_replace(label_replace(
                    max by (instance, guest_host, vm) (last_over_time(hypervisor_vm_info{job="integrations/hypervisor"}[1h])),
                    "hypervisor", "$1", "instance", "(.+)"), "instance", "$1", "guest_host", "(.+)")
                )
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            queryType: expression
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          runbook_url: https://github.com/DEV-ASSESSORIA-TECH/grafana/blob/main/docs/alerts/WIN-102.md
          __dashboardUid__: servers-windows
          __panelId__: "368"
          summary: 'Servidor Windows {{ $labels.instance }} sem métricas'
          description: |-
            O servidor {{ $labels.instance }} parou de enviar métricas há mais de 5 minutos.

            Possíveis causas: servidor desligado ou travado, Grafana Alloy parado, falha de rede até o monitoramento.
            Servidor desativado de propósito some deste alerta depois de 7 dias (ou silencie).
        labels:
          alert_code: WIN-102
          severity: warning
          area: windows
          scope: guest
          dep_hypervisor: '{{ with $$labels.hypervisor }}{{ . | toLower | reReplaceAll "[^a-z0-9_]" "_" }}{{ end }}'
          dep_vm: '{{ with $$labels.vm }}{{ . | toLower | reReplaceAll "[^a-z0-9_]" "_" }}{{ end }}'
        isPaused: false

      - uid: win-110
        title: '[WIN-110] Serviço do Active Directory parado'
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: |-
                (
                  windows_service_state{job="integrations/windows",state="running",instance=~"srv-ad|srv-ad-trs",name=~"NTDS|DNS|Netlogon|Kdc|DFSR|ADWS|W32Time"}
                )
                * on (instance) group_left (vm, hypervisor)
                max by (instance, vm, hypervisor) (
                  label_replace(label_replace(
                    max by (instance, guest_host, vm) (last_over_time(hypervisor_vm_info{job="integrations/hypervisor"}[1h])),
                    "hypervisor", "$1", "instance", "(.+)"), "instance", "$1", "guest_host", "(.+)")
                )
                or
                (
                  windows_service_state{job="integrations/windows",state="running",instance=~"srv-ad|srv-ad-trs",name=~"NTDS|DNS|Netlogon|Kdc|DFSR|ADWS|W32Time"}
                )
                unless on (instance)
                max by (instance, vm, hypervisor) (
                  label_replace(label_replace(
                    max by (instance, guest_host, vm) (last_over_time(hypervisor_vm_info{job="integrations/hypervisor"}[1h])),
                    "hypervisor", "$1", "instance", "(.+)"), "instance", "$1", "guest_host", "(.+)")
                )
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            queryType: expression
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 3m
        annotations:
          runbook_url: https://github.com/DEV-ASSESSORIA-TECH/grafana/blob/main/docs/alerts/WIN-110.md
          __dashboardUid__: servers-windows
          __panelId__: "7"
          summary: 'Serviço {{ $labels.name }} parado no controlador de domínio {{ $labels.instance }}'
          description: |-
            O serviço {{ $labels.name }} não está em execução no controlador de domínio {{ $labels.instance }}.

            Sem ele, autenticação, DNS, replicação ou horário do domínio podem falhar.
            Verifique o serviço e o Event Log (Directory Service, DNS Server, DFS Replication).
        labels:
          alert_code: WIN-110
          severity: critical
          area: windows
          scope: guest
          dep_hypervisor: '{{ with $$labels.hypervisor }}{{ . | toLower | reReplaceAll "[^a-z0-9_]" "_" }}{{ end }}'
          dep_vm: '{{ with $$labels.vm }}{{ . | toLower | reReplaceAll "[^a-z0-9_]" "_" }}{{ end }}'
        isPaused: false

      - uid: win-111
        title: '[WIN-111] Serviço de aplicação parado'
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: |-
                (
                  windows_service_state{job="integrations/windows",state="running",instance="srv-contabil-ass",name=~"SQLANYs_Servidor_Dominio17|ServicoDominioAtendimento|postgresql-x64-17|MySQL"}
                  or
                  windows_service_state{job="integrations/windows",state="running",instance="srv-dom-trs",name=~"SQLANYs_Servidor_Dominio17|ServicoDominioAtendimento|W3SVC"}
                  or
                  windows_service_state{job="integrations/windows",state="running",instance="srv-seven-mtc",name="MySQL"}
                )
                * on (instance) group_left (vm, hypervisor)
                max by (instance, vm, hypervisor) (
                  label_replace(label_replace(
                    max by (instance, guest_host, vm) (last_over_time(hypervisor_vm_info{job="integrations/hypervisor"}[1h])),
                    "hypervisor", "$1", "instance", "(.+)"), "instance", "$1", "guest_host", "(.+)")
                )
                or
                (
                  windows_service_state{job="integrations/windows",state="running",instance="srv-contabil-ass",name=~"SQLANYs_Servidor_Dominio17|ServicoDominioAtendimento|postgresql-x64-17|MySQL"}
                  or
                  windows_service_state{job="integrations/windows",state="running",instance="srv-dom-trs",name=~"SQLANYs_Servidor_Dominio17|ServicoDominioAtendimento|W3SVC"}
                  or
                  windows_service_state{job="integrations/windows",state="running",instance="srv-seven-mtc",name="MySQL"}
                )
                unless on (instance)
                max by (instance, vm, hypervisor) (
                  label_replace(label_replace(
                    max by (instance, guest_host, vm) (last_over_time(hypervisor_vm_info{job="integrations/hypervisor"}[1h])),
                    "hypervisor", "$1", "instance", "(.+)"), "instance", "$1", "guest_host", "(.+)")
                )
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            queryType: expression
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 3m
        annotations:
          runbook_url: https://github.com/DEV-ASSESSORIA-TECH/grafana/blob/main/docs/alerts/WIN-111.md
          __dashboardUid__: servers-windows
          __panelId__: "7"
          summary: 'Serviço {{ $labels.name }} parado em {{ $labels.instance }}'
          description: |-
            O serviço {{ $labels.name }} não está em execução em {{ $labels.instance }}.

            É um serviço de aplicação (banco de dados ou sistema Domínio). Os usuários podem estar sem acesso.
            Verifique o serviço e o Event Log (Application).
        labels:
          alert_code: WIN-111
          severity: warning
          area: windows
          scope: guest
          dep_hypervisor: '{{ with $$labels.hypervisor }}{{ . | toLower | reReplaceAll "[^a-z0-9_]" "_" }}{{ end }}'
          dep_vm: '{{ with $$labels.vm }}{{ . | toLower | reReplaceAll "[^a-z0-9_]" "_" }}{{ end }}'
        isPaused: false

      - uid: win-112
        title: '[WIN-112] Serviço em curadoria parado'
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: |-
                windows_service_state{job="integrations/windows",state="running",name="ServicoBackupNuvem"}
                or
                windows_service_state{job="integrations/windows",state="running",instance="srv-host01",name="ServicoDominioAtendimento"}
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            queryType: expression
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          runbook_url: https://github.com/DEV-ASSESSORIA-TECH/grafana/blob/main/docs/alerts/WIN-112.md
          __dashboardUid__: servers-windows
          __panelId__: "7"
          summary: 'Serviço {{ $labels.name }} parado em {{ $labels.instance }}'
          description: |-
            O serviço {{ $labels.name }} não está em execução em {{ $labels.instance }}.

            Serviço em curadoria: ainda não está definido se deve rodar neste servidor. Registro informativo, sem notificação.
            Quando a curadoria terminar, mova o serviço para WIN-111 ou retire-o desta regra.
        labels:
          alert_code: WIN-112
          severity: info
          area: windows
          scope: service
        isPaused: false

      - uid: win-120
        title: '[WIN-120] Servidor Windows reiniciado'
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: |-
                (
                  time() - windows_system_boot_time_timestamp{job="integrations/windows"}
                )
                * on (instance) group_left (vm, hypervisor)
                max by (instance, vm, hypervisor) (
                  label_replace(label_replace(
                    max by (instance, guest_host, vm) (last_over_time(hypervisor_vm_info{job="integrations/hypervisor"}[1h])),
                    "hypervisor", "$1", "instance", "(.+)"), "instance", "$1", "guest_host", "(.+)")
                )
                or
                (
                  time() - windows_system_boot_time_timestamp{job="integrations/windows"}
                )
                unless on (instance)
                max by (instance, vm, hypervisor) (
                  label_replace(label_replace(
                    max by (instance, guest_host, vm) (last_over_time(hypervisor_vm_info{job="integrations/hypervisor"}[1h])),
                    "hypervisor", "$1", "instance", "(.+)"), "instance", "$1", "guest_host", "(.+)")
                )
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            queryType: expression
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 900
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          runbook_url: https://github.com/DEV-ASSESSORIA-TECH/grafana/blob/main/docs/alerts/WIN-120.md
          __dashboardUid__: servers-windows
          __panelId__: "51"
          summary: 'Servidor {{ $labels.instance }} reiniciado'
          description: |-
            O servidor {{ $labels.instance }} foi ligado há menos de 15 minutos.

            Registro informativo. Se o reinício não foi planejado, verifique o Event Log (Kernel-Power 41, EventLog 6008).
        labels:
          alert_code: WIN-120
          severity: info
          area: windows
          scope: guest
          dep_hypervisor: '{{ with $$labels.hypervisor }}{{ . | toLower | reReplaceAll "[^a-z0-9_]" "_" }}{{ end }}'
          dep_vm: '{{ with $$labels.vm }}{{ . | toLower | reReplaceAll "[^a-z0-9_]" "_" }}{{ end }}'
        isPaused: false

      - uid: win-130
        title: '[WIN-130] Servidor Windows sem sincronizar o horário'
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 7200
              to: 0
            datasourceUid: loki
            model:
              editorMode: code
              queryType: instant
              expr: |-
                sum by (host) (count_over_time(
                  {job="windows-eventlog", host!~"srv-host01|srv-host01-mtc"}
                  | json source, event_id
                  | source="Microsoft-Windows-Time-Service" | event_id=~"129|134|36|47"
                  [2h]
                ))
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            queryType: expression
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          runbook_url: https://github.com/DEV-ASSESSORIA-TECH/grafana/blob/main/docs/alerts/WIN-130.md
          __dashboardUid__: servers-windows
          __panelId__: "51"
          summary: 'Servidor {{ $labels.host }} sem sincronizar o horário'
          description: |-
            O serviço de horário de {{ $labels.host }} registrou falhas repetidas de sincronização nas últimas 2 horas (Time-Service 129/134/36/47).

            Nos controladores de domínio, horário errado quebra Kerberos para todo o domínio.
            Verifique: w32tm /query /status, w32tm /query /source e w32tm /resync.
        labels:
          alert_code: WIN-130
          severity: warning
          area: windows
          scope: guest
          dep_vm: '{{ with $$labels.host }}{{ . | toLower | reReplaceAll "[^a-z0-9_]" "_" }}{{ end }}'
        isPaused: false

      - uid: win-201
        title: '[WIN-201] Disco Windows acima de 90%'
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: |-
                (
                  100 * (1 - windows_logical_disk_free_bytes{job="integrations/windows",instance!~"srv-host01|srv-host01-mtc",volume=~"[A-Z]:"}
                    / windows_logical_disk_size_bytes{job="integrations/windows",instance!~"srv-host01|srv-host01-mtc",volume=~"[A-Z]:"})
                  and on (instance, volume)
                  windows_logical_disk_free_bytes{job="integrations/windows",instance!~"srv-host01|srv-host01-mtc",volume=~"[A-Z]:"} < 20 * 2^30
                )
                * on (instance) group_left (vm, hypervisor)
                max by (instance, vm, hypervisor) (
                  label_replace(label_replace(
                    max by (instance, guest_host, vm) (last_over_time(hypervisor_vm_info{job="integrations/hypervisor"}[1h])),
                    "hypervisor", "$1", "instance", "(.+)"), "instance", "$1", "guest_host", "(.+)")
                )
                or
                (
                  100 * (1 - windows_logical_disk_free_bytes{job="integrations/windows",instance!~"srv-host01|srv-host01-mtc",volume=~"[A-Z]:"}
                    / windows_logical_disk_size_bytes{job="integrations/windows",instance!~"srv-host01|srv-host01-mtc",volume=~"[A-Z]:"})
                  and on (instance, volume)
                  windows_logical_disk_free_bytes{job="integrations/windows",instance!~"srv-host01|srv-host01-mtc",volume=~"[A-Z]:"} < 20 * 2^30
                )
                unless on (instance)
                max by (instance, vm, hypervisor) (
                  label_replace(label_replace(
                    max by (instance, guest_host, vm) (last_over_time(hypervisor_vm_info{job="integrations/hypervisor"}[1h])),
                    "hypervisor", "$1", "instance", "(.+)"), "instance", "$1", "guest_host", "(.+)")
                )
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            queryType: expression
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 90
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          runbook_url: https://github.com/DEV-ASSESSORIA-TECH/grafana/blob/main/docs/alerts/WIN-201.md
          __dashboardUid__: servers-windows
          __panelId__: "369"
