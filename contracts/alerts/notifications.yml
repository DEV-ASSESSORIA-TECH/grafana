# Contrato de notificacao; nao provisionar este YAML no Grafana.
schema_version: 1
kind: alert_notification_contract
version: 0.2.0
id: alert-notifications
title: Divisao de responsabilidade das notificacoes
status: defined
scope: >-
  O que das notificacoes vem do repositorio e o que fica na UI. As regras so publicam labels; quem decide o destino e
  a notification policy padrao, editada na UI.
managed_in_ui:
  - notification policies (arvore padrao): roteamento livre pelos labels de contracts/alerts/labels.yml
  - contact points (e-mail, webhooks, APIs)
  - silences (manutencao pontual)
managed_in_files:
  muteTimes: alerting/notifications/mute-timings.yaml (usaveis nas policies da UI)
  templates: alerting/notifications/templates.yaml (usaveis nos contact points da UI)
routing_labels:
  - alert_code
  - severity
  - area
  - scope
  - dep_hypervisor
  - dep_vm
recommended_ui_policies:
  - matcher: severity = info
    mute_timing: sempre
    why: info fica visivel no Grafana e nunca notifica.
  - group_by: [area, dep_hypervisor]
    why: a queda de um host vira uma notificacao so.
rules:
  - alerting/ nao declara policies, resetPolicies nem contact points (o arquivo travaria a edicao na UI e substituiria a arvore inteira).
  - Regras nao usam notification_settings (roteamento direto para contact point); o destino sai sempre da policy.
  - Nome de mute timing ou template usado na UI nao muda sem ajustar a UI junto.
