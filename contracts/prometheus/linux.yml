# Contrato observado para consumidores de dashboards; nao provisionar este YAML no Grafana.
schema_version: 2
kind: observability_contract
version: 0.3.0
id: linux
title: Linux / Node Exporter embarcado
status: observed_baseline
observed_at_utc: '2026-11-04T19:01:53.881Z'
job: integrations/unix
references:
  common: common.yml
identity:
  target_key:
    - job
    - instance
  host_label: host
  per_cpu_key:
    - instance
    - cpu
  filesystem_key:
    - instance
    - device
    - mountpoint
    - fstype
  network_key:
    - instance
    - device
  disk_io_key:
    - instance
    - device
  systemd_key:
    - instance
    - name
    - state
grafana_variables:
  syntax: Grafana label_values, nao PromQL da API
  instance:
    query: label_values(node_uname_info{job="integrations/unix"}, instance)
    multi: true
    all_value: .*
  device:
    query: label_values(node_network_receive_bytes_total{job="integrations/unix",instance=~"$instance"}, device)
    multi: true
    suggested_default: eth0
metric_groups:
  cpu:
    title: CPU e carga
    metrics_observed:
      - node_cpu_seconds_total
      - node_load1
      - node_load5
      - node_load15
      - node_procs_running
      - node_procs_blocked
  memory:
    title: Memoria e swap
    metrics_observed:
      - node_memory_MemTotal_bytes
      - node_memory_MemAvailable_bytes
      - node_memory_MemFree_bytes
      - node_memory_Buffers_bytes
      - node_memory_Cached_bytes
      - node_memory_SwapTotal_bytes
      - node_memory_SwapFree_bytes
  filesystem:
    title: Capacidade, inodes e estado das montagens
    metrics_observed:
      - node_filesystem_avail_bytes
      - node_filesystem_device_error
      - node_filesystem_files
      - node_filesystem_files_free
      - node_filesystem_free_bytes
      - node_filesystem_readonly
      - node_filesystem_size_bytes
    interpretation: Usar device + mountpoint + fstype. Separar tmpfs dos volumes persistentes; nao somar montagens
      repetidas.
  disk_io:
    title: I/O dos dispositivos de bloco
    metrics_observed:
      - node_disk_device_mapper_info
      - node_disk_discard_time_seconds_total
      - node_disk_discarded_sectors_total
      - node_disk_discards_completed_total
      - node_disk_discards_merged_total
      - node_disk_filesystem_info
      - node_disk_flush_requests_time_seconds_total
      - node_disk_flush_requests_total
      - node_disk_info
      - node_disk_io_now
      - node_disk_io_time_seconds_total
      - node_disk_io_time_weighted_seconds_total
      - node_disk_read_bytes_total
      - node_disk_read_time_seconds_total
