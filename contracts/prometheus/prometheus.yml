query_recipes:
  - id: head_series
    title: Series no head do TSDB
    promql: prometheus_tsdb_head_series{job="prometheus"}
    unit: count
    dependencies:
      - prometheus_tsdb_head_series
    validation: dependencies_in_export; not_executed
    notes:
      - Esta metrica nao teve seu valor exportado. Nao substituir pela contagem de /series.
  - id: ingested_samples_per_second
    title: Amostras adicionadas ao head por segundo
    promql: rate(prometheus_tsdb_head_samples_appended_total{job="prometheus"}[5m])
    unit: samples_per_second
    dependencies:
      - prometheus_tsdb_head_samples_appended_total
    validation: dependencies_in_export; not_executed
    notes: []
  - id: process_memory
    title: Memoria residente do Prometheus
    promql: process_resident_memory_bytes{job="prometheus"}
    unit: bytes
    dependencies:
      - process_resident_memory_bytes
    validation: dependencies_in_export; not_executed
    notes: []
  - id: config_reload
    title: Resultado do ultimo reload de configuracao
    promql: prometheus_config_last_reload_successful{job="prometheus"}
    unit: boolean
    dependencies:
      - prometheus_config_last_reload_successful
    validation: dependencies_in_export; not_executed
    notes: []
  - id: self_up
    title: Scrape do proprio servidor
    promql: up{job="prometheus"}
    unit: boolean
    dependencies:
      - up
    validation: dependencies_in_export; not_executed
    notes: []
limitations:
  - Este contrato foi incluido como complemento porque o job prometheus estava na exportacao.
  - O inventario de /targets cobre apenas os scrapes locais; nao descreve todos os componentes Alloy remotos.
  - Metricas de notifications/rules sao telemetria da aplicacao; nao comprovam configuracao ou entrega de alertas.
  - O schema nao informa retencao configurada, limites de armazenamento, scrape_config dos agentes ou resultados
    das consultas.
change_policy:
  baseline_counts_are_fixed_requirements: false
  require_new_metrics_before_using_in_dashboard: true
  preserve_raw_labels: true
  alloy_changes_applied: false
query_policy:
  numerically_validated: false
  promql_parser_validation: not_performed
  static_metric_dependencies_checked: true
  documentation_sources:
    - prometheus_functions
  note: As receitas usam semantica padrao onde conhecida; o catalogo preserva a ausencia de TYPE/HELP do exporter
    em execucao.
