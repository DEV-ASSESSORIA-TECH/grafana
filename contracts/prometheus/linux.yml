query_recipes:
  - id: cpu_non_idle_pct
    title: CPU nao ociosa por servidor
    promql: 100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{job="integrations/unix",mode="idle"}[5m])))
    unit: percent_0_100
    dependencies:
      - node_cpu_seconds_total
    validation: dependencies_in_export; not_executed
    notes:
      - Receita de contador padrao; inclui iowait entre os estados nao idle.
  - id: memory_used_pct
    title: RAM indisponivel ao sistema
    promql: 100 * (1 - node_memory_MemAvailable_bytes{job="integrations/unix"} / node_memory_MemTotal_bytes{job="integrations/unix"})
    unit: percent_0_100
    dependencies:
      - node_memory_MemAvailable_bytes
      - node_memory_MemTotal_bytes
    validation: dependencies_in_export; not_executed
    notes: []
  - id: filesystem_unavailable_pct
    title: Capacidade indisponivel ao usuario comum
    promql: (100 * (1 - node_filesystem_avail_bytes{job="integrations/unix",fstype!~"tmpfs|devtmpfs|overlay|squashfs"}
      / node_filesystem_size_bytes{job="integrations/unix",fstype!~"tmpfs|devtmpfs|overlay|squashfs"})) and (node_filesystem_size_bytes{job="integrations/unix",fstype!~"tmpfs|devtmpfs|overlay|squashfs"}
      > 0)
    unit: percent_0_100
    dependencies:
      - node_filesystem_avail_bytes
      - node_filesystem_size_bytes
    validation: dependencies_in_export; not_executed
    notes:
      - Inclui blocos reservados indisponiveis ao usuario; nao e exatamente size - free.
  - id: network_receive_eth0_bps
    title: Entrada pela interface eth0
    promql: 8 * rate(node_network_receive_bytes_total{job="integrations/unix",device="eth0"}[5m])
    unit: bits_per_second
    dependencies:
      - node_network_receive_bytes_total
    validation: dependencies_in_export; not_executed
    notes:
      - 'Nao fixar nome de interface (ex.: eth0) como exigencia.'
  - id: network_transmit_eth0_bps
    title: Saida pela interface eth0
    promql: 8 * rate(node_network_transmit_bytes_total{job="integrations/unix",device="eth0"}[5m])
    unit: bits_per_second
    dependencies:
      - node_network_transmit_bytes_total
    validation: dependencies_in_export; not_executed
    notes: []
  - id: disk_read_by_device
    title: Leitura por dispositivo de bloco
    promql: rate(node_disk_read_bytes_total{job="integrations/unix"}[5m])
    unit: bytes_per_second
    dependencies:
      - node_disk_read_bytes_total
    validation: dependencies_in_export; not_executed
    notes:
      - Nao agregar sda e dm-0 indiscriminadamente.
  - id: failed_systemd_flags
    title: Flags de falha das unidades coletadas
    promql: node_systemd_unit_state{job="integrations/unix",state="failed"}
    unit: boolean
    dependencies:
      - node_systemd_unit_state
    validation: dependencies_in_export; not_executed
    notes:
      - Zero e um valor do indicador; ausencia da serie nao e zero.
  - id: collector_success
    title: Sucesso dos coletores
    promql: node_scrape_collector_success{job="integrations/unix"}
    unit: boolean
    dependencies:
      - node_scrape_collector_success
    validation: dependencies_in_export; not_executed
    notes: []
limitations:
  - O exporter nao publica TYPE/HELP de node_*; as formulas padrao nao substituem a validacao dos valores.
  - Metricas de systemd podem nao existir em todos os hosts; ausencia nao significa servicos saudaveis.
  - A presenca de node_scrape_collector_success nao comprova sucesso do coletor; verificar o valor 1.
change_policy:
  baseline_counts_are_fixed_requirements: false
  require_new_metrics_before_using_in_dashboard: true
  preserve_raw_labels: true
query_policy:
  numerically_validated: false
  promql_parser_validation: not_performed
  static_metric_dependencies_checked: true
  documentation_sources:
    - prometheus_functions
  note: As receitas usam semantica padrao onde conhecida; o exporter nao publica TYPE/HELP de todas as metricas.
