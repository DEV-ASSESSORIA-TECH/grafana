    interpretation: 'Ha interfaces fisicas, lo, redes Docker e overlay/VPN (ex.: tailscale0). Nao somar o trafego
      de overlay/VPN com a interface que o transporta.'
  systemd:
    title: Servicos systemd
    metrics_observed:
      - node_systemd_service_restart_total
      - node_systemd_system_running
      - node_systemd_unit_state
      - node_systemd_units
      - node_systemd_version
    interpretation: Cobertura pode ser parcial entre hosts. A ausencia em um host nao significa que seus servicos
      estao saudaveis.
  os_identity:
    title: Sistema e identificacao
    metrics_observed:
      - node_uname_info
      - node_os_info
      - node_boot_time_seconds
      - node_time_seconds
      - node_exporter_build_info
  collection_health:
