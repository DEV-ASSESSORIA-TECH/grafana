schema_version: 1
kind: loki_log_contract
version: 0.3.0
status: observed_baseline
observed_date: '2026-11-04'
source: Alloy Windows Hyper-V / loki.source.windowsevent
job: hyperv-eventlog
identity:
  required_labels:
  - job
  - host
  observed_labels:
  - channel
  - computer
  - host
  - job
  - level
  - service_name
expected_configuration:
  channels:
  - Microsoft-Windows-Hyper-V-VMMS-Admin
  - Microsoft-Windows-Hyper-V-Worker-Admin
level_values:
  level: >-
    Numero do nivel do Event Log: 1 critico, 2 erro, 3 aviso, 4 informacao, 5 detalhado. Ausente em parte das
    linhas. Para exibir nomes em contagens, agrupar pelo numero e traduzir as series agregadas com label_replace
    (nunca label_format linha a linha antes de contar).
limitations:
- Worker-Admin so gera fluxo quando ha eventos no periodo; a ausencia do canal nao indica falha de coleta.
- Dados de logs nao fornecem automaticamente o estado atual de cada VM.
