schema_version: 2
kind: observability_contract_common
version: 0.3.0
status: observed_baseline
observed_at_utc: '2026-11-04T19:01:53.881Z'
scope: Contrato de consumo dos dados atualmente observados. Nao e especificacao da configuracao instalada nem obrigacao
  de ativar coletores.
evidence:
  metric_schema: Nomes e labels confirmados em /api/v1/series do Prometheus.
  metadata: TYPE/HELP/UNIT so sao confirmados quando o exporter os publica. A API nao associa esses registros a
    cada job.
  targets: /targets lista apenas os scrapes diretos (Prometheus e Uptime Kuma). Os targets Alloy sao inventariados
    por up/series.
identity:
  target_key:
    - job
    - instance
  alloy_host_label: host
  observed_alloy_host_equals_instance: true
  hyperv_instance_meaning: host hypervisor, nunca o sistema operacional convidado
  case_sensitivity: vm em maiusculas e instance em minusculas. Nao ha join direto automatico entre elas.
  host_is_not_global: Nenhum tenant/environment/site foi observado. Evitar homonimos caso a coleta se expanda para
    clientes diferentes.
consumer_rules:
  - Fixar o job em toda consulta e usar instance na selecao do servidor.
  - Usar =~ com variaveis Grafana multi-value; usar ${instance:regex} para interpolar valores corretamente.
  - Manter labels reais; nao assumir labels hostname, container, service, node, vm_id ou environment que nao foram
    observadas.
  - Nao transformar ausencia de serie em zero ou em estado saudavel.
  - Nao usar numero de series como numero de VMs, containers ou entidades sem escolher uma metrica e deduplicar
    pela chave correta.
  - Nao aplicar rate a gauges; nomes terminados em total nao substituem a verificacao de TYPE/HELP.
  - Contagens do inventario sao informativas e variaveis, nao limites obrigatorios do contrato.
  - Queries sao receitas iniciais, com dependencias verificadas estaticamente; precisam de avaliacao no Prometheus
    para validar valores e desempenho.
  - Dados de runtime, servicos e systemd podem ter cobertura parcial sem invalidar CPU, memoria e discos do mesmo
    host.
non_goals:
  - Mudar o Alloy ou o Docker Compose
  - Instalar coletores
  - Publicar endpoints
  - Criar dashboards
  - Comprovar alertas ativos, retencao ou SLA
