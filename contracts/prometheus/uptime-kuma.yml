# Contrato observado para consumidores de dashboards; nao provisionar este YAML no Grafana.
schema_version: 2
kind: observability_contract
version: 0.4.0
id: uptime-kuma
title: Uptime Kuma / disponibilidade e certificados
status: observed_baseline
observed_at_utc: '2026-11-04T19:01:53.881Z'
job: uptime-kuma
references:
  common: common.yml
identity:
  target_key:
    - job
    - instance
  monitor_key:
    - job
    - instance
    - monitor_id
  display_name_label: monitor_name
  monitor_type_label: monitor_type
  url_label: monitor_url
  window_key:
    - job
    - instance
    - monitor_id
    - window
  monitor_hostname_null_is_string: true
  host_label_present: false
  tag_labels:
    producer: Uptime Kuma 2.5.8 server/prometheus.js (tags do monitor viram labels)
    labels:
      criticidade:
        - alta
        - critica
      exposicao:
        - cloudflare
        - direta
        - interna
      grupo:
        - aplicacao
        - infraestrutura
        - externo
    absent_on: monitor_type=group (grupos nao tem tags)
    rules:
      - O Kuma monta a lista de labels so na inicializacao. Tag NOVA exige reiniciar o container; ate la, os monitores
        com ela somem de todas as metricas (erro "Added label ... is not included in initial labelset" no log).
      - Mudar o valor de uma tag existente nao exige restart.
      - Nome e valor passam por [a-zA-Z0-9_] (acentos e espacos sao removidos). Usar ASCII minusculo.
      - Tag sem valor vira label vazio (igual a ausente no Prometheus). Usar sempre nome + valor.
      - Uma tag por monitor; repetir a tag junta os valores num label so.
    loki_check: count_over_time({job="docker",compose_project="uptime",compose_service="kuma"} |= "PROMETHEUS" |=
      "ERROR" [1h])
grafana_variables:
  syntax: Grafana label_values, nao PromQL da API
  monitor_id:
    query: label_values(monitor_status{job="uptime-kuma",monitor_type!="group"}, monitor_id)
    multi: true
    all_value: .*
  criticidade:
    query: label_values(monitor_status{job="uptime-kuma",monitor_type!="group"}, criticidade)
    multi: true
    all_value: .*
  exposicao:
    query: label_values(monitor_status{job="uptime-kuma",monitor_type!="group"}, exposicao)
    multi: true
    all_value: .*
  grupo:
    query: label_values(monitor_status{job="uptime-kuma",monitor_type!="group"}, grupo)
    multi: true
    all_value: .*
  window:
    query: label_values(monitor_uptime_ratio{job="uptime-kuma"}, window)
    multi: false
    suggested_default: 1d
metric_groups:
  monitor_status:
    title: Estado atual do monitor
    metrics_observed:
      - monitor_status
    interpretation: 'Enums confirmados pelo HELP enviado: 0 down, 1 up, 2 pending, 3 maintenance. Monitor group
      nao e uma verificacao independente.'
  latency_current:
    title: Tempo de resposta atual em milissegundos
    metrics_observed:
      - monitor_response_time
    interpretation: Gauge em ms, conforme HELP do export.
  latency_windows:
    title: Media movel de resposta em segundos
    metrics_observed:
      - monitor_response_time_seconds
    interpretation: Gauge em segundos com window. Nao e contador, histogram ou quantil.
  availability_windows:
    title: Disponibilidade por janela
    metrics_observed:
      - monitor_uptime_ratio
    interpretation: Gauge ratio 0..1, com window 1d/30d/365d. Nao e SLA contratado nem evidencia de historico completo
      da janela.
  tls:
    title: Certificados TLS
    metrics_observed:
      - monitor_cert_days_remaining
      - monitor_cert_is_valid
    interpretation: Somente monitores com TLS possuem series de certificado; ausencia para group e esperada, nao
      erro de certificado.
  application:
    title: Versao e conexoes
    metrics_observed:
      - app_version
      - expressjs_number_of_open_connections
  runtime:
    title: Runtime Node.js/processo
    metrics_observed:
      - nodejs_active_handles
      - nodejs_active_handles_total
      - nodejs_active_requests_total
      - nodejs_eventloop_lag_max_seconds
      - nodejs_eventloop_lag_mean_seconds
      - nodejs_eventloop_lag_min_seconds
      - nodejs_eventloop_lag_p50_seconds
      - nodejs_eventloop_lag_p90_seconds
      - nodejs_eventloop_lag_p99_seconds
      - nodejs_eventloop_lag_seconds
      - nodejs_eventloop_lag_stddev_seconds
      - nodejs_external_memory_bytes
      - nodejs_gc_duration_seconds_bucket
      - nodejs_gc_duration_seconds_count
      - nodejs_gc_duration_seconds_sum
      - nodejs_heap_size_total_bytes
      - nodejs_heap_size_used_bytes
      - nodejs_heap_space_size_available_bytes
      - nodejs_heap_space_size_total_bytes
      - nodejs_heap_space_size_used_bytes
      - nodejs_version_info
      - process_cpu_seconds_total
      - process_cpu_system_seconds_total
      - process_cpu_user_seconds_total
      - process_heap_bytes
      - process_max_fds
      - process_open_fds
      - process_resident_memory_bytes
      - process_start_time_seconds
      - process_virtual_memory_bytes
  collection_health:
    title: Scrape do Kuma
    metrics_observed:
      - scrape_duration_seconds
      - scrape_samples_post_metric_relabeling
      - scrape_samples_scraped
      - scrape_series_added
      - up
query_recipes:
  - id: checks_status
    title: Estados das verificacoes, sem os grupos
    promql: monitor_status{job="uptime-kuma",monitor_type!="group"}
    unit: enum
    dependencies:
      - monitor_status
    validation: dependencies_in_export; not_executed
    notes: []
  - id: checks_up_count
    title: Verificacoes em estado up
    promql: sum(monitor_status{job="uptime-kuma",monitor_type!="group"} == bool 1)
    unit: count
    dependencies:
      - monitor_status
    validation: dependencies_in_export; not_executed
    notes:
      - Se nenhuma serie existir, conservar no data; nao acrescentar or vector(0).
  - id: checks_down_count
    title: Verificacoes em estado down
    promql: sum(monitor_status{job="uptime-kuma",monitor_type!="group"} == bool 0)
    unit: count
    dependencies:
      - monitor_status
    validation: dependencies_in_export; not_executed
    notes:
      - Pending e maintenance nao sao down nem up.
  - id: uptime_one_day_pct
    title: Disponibilidade calculada pelo Kuma na janela de 1 dia
    promql: 100 * monitor_uptime_ratio{job="uptime-kuma",monitor_type!="group",window="1d"}
    unit: percent_0_100
    dependencies:
      - monitor_uptime_ratio
    validation: dependencies_in_export; not_executed
    notes: []
  - id: current_response_ms
    title: Resposta atual por verificacao
    promql: monitor_response_time{job="uptime-kuma",monitor_type!="group"}
    unit: milliseconds
    dependencies:
      - monitor_response_time
    validation: dependencies_in_export; not_executed
    notes: []
  - id: response_one_day_seconds
    title: Resposta media em 1 dia
    promql: monitor_response_time_seconds{job="uptime-kuma",monitor_type!="group",window="1d"}
    unit: seconds
    dependencies:
      - monitor_response_time_seconds
    validation: dependencies_in_export; not_executed
    notes: []
  - id: certificate_days_remaining
    title: Dias ate expirar o certificado
    promql: monitor_cert_days_remaining{job="uptime-kuma",monitor_type!="group"}
    unit: days
    dependencies:
      - monitor_cert_days_remaining
    validation: dependencies_in_export; not_executed
    notes: []
  - id: certificate_valid
    title: Validade do certificado
    promql: monitor_cert_is_valid{job="uptime-kuma",monitor_type!="group"}
    unit: boolean
    dependencies:
      - monitor_cert_is_valid
    validation: dependencies_in_export; not_executed
    notes: []
  - id: exporter_up
    title: Coleta do proprio Kuma
    promql: up{job="uptime-kuma"}
    unit: boolean
    dependencies:
      - up
    validation: dependencies_in_export; not_executed
    notes:
      - Nao confundir com o estado de cada monitor.
limitations:
  - Monitores do tipo group sao estrutura de agrupamento, nao servicos; usar monitor_type!="group" ao contar.
  - O Kuma nao exporta o grupo (pai) de cada monitor; a ligacao monitor -> grupo vem da tag grupo, mantida a mao.
  - Disponibilidade longa deve vir de monitor_uptime_ratio (calculado pelo Kuma), nao da retencao do Prometheus.
  - A presenca das janelas 1d, 30d e 365d nao demonstra historico completo de cada janela.
  - monitor_response_time usa milissegundos; monitor_response_time_seconds usa segundos e representa uma media na
    janela.
  - monitor_hostname e monitor_port aparecem com o texto literal null; monitor_url dos grupos e um valor generico.
    Nao usar como chave de identidade.
change_policy:
  baseline_counts_are_fixed_requirements: false
  require_new_metrics_before_using_in_dashboard: true
  preserve_raw_labels: true
value_mappings:
  monitor_status:
    source: metadata.json:monitor_status
    values:
      '0': down
      '1': up
      '2': pending
      '3': maintenance
  monitor_cert_is_valid:
    source: metadata.json:monitor_cert_is_valid
    values:
      '0': invalid
      '1': valid
query_policy:
  numerically_validated: false
  promql_parser_validation: not_performed
  static_metric_dependencies_checked: true
  documentation_sources:
    - prometheus_functions
  note: As receitas usam semantica padrao onde conhecida; o exporter nao publica TYPE/HELP de todas as metricas.
