# Catalogo dos codigos de alerta; nao provisionar este YAML no Grafana.
schema_version: 1
kind: alert_code_catalog
version: 0.1.0
id: alert-codes
title: Catalogo de codigos de alerta
status: defined
scope: >-
  Identidade permanente de cada alerta. O codigo liga a regra (alerting/rules), o titulo no Grafana, a notificacao
  e o procedimento (runbook no Outline). O CI exige que regras e catalogo coincidam.
ranges:
  '1xx': Disponibilidade (10x host/alvo principal, 11x VM ou componente hospedado)
  '2xx': Capacidade (armazenamento, memoria, CPU sustentada)
  '3xx': Saude da coleta (inventario, exporters, heartbeat do agente)
  '4xx': Desempenho (latencia, fila, disputa)
rules:
  - Codigo e permanente. Alerta removido fica com status retired e o codigo nunca e reutilizado.
  - uid e o UID da regra no Grafana (nao muda ao renomear o titulo).
  - title e o titulo sem o codigo; no Grafana o titulo e '[CODIGO] title'.
  - severity e scope devem ser iguais aos labels da regra; a area vem do prefixo (labels.yml).
  - runbook e a URL do procedimento no Outline (annotation runbook_url); null ate o documento existir.
codes:
