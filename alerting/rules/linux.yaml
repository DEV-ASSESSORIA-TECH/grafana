# Regras de alerta dos servidores Linux. Codigos em contracts/alerts/codes.yml.
# Labels: escrever $$labels (o provisionamento interpola variaveis de ambiente nos labels).
# Annotations e consultas nao sao interpoladas: nelas, $labels.
# Painel vinculado: annotations __dashboardUid__/__panelId__ (o Grafana ignora os campos dashboardUid/panelId).
apiVersion: 1
groups:
  - orgId: 1
    name: linux-1m
    folder: INFRA
    interval: 1m
    rules:
      - uid: lin-101
        title: '[LIN-101] Servidor Linux crítico sem métricas'
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: |-
                (
                  group by (instance) (max_over_time(up{job="integrations/unix",instance=~"srv-vpn|srv-rmm|srv-altogarcas|srv-mon|srv-web"}[7d]))
                  unless
                  group by (instance) (up{job="integrations/unix",instance=~"srv-vpn|srv-rmm|srv-altogarcas|srv-mon|srv-web"} == 1)
                )
                * on (instance) group_left (vm, hypervisor)
                max by (instance, vm, hypervisor) (
                  label_replace(label_replace(
                    max by (instance, guest_host, vm) (last_over_time(hypervisor_vm_info{job="integrations/hypervisor"}[1h])),
                    "hypervisor", "$1", "instance", "(.+)"), "instance", "$1", "guest_host", "(.+)")
                )
                or
                (
                  group by (instance) (max_over_time(up{job="integrations/unix",instance=~"srv-vpn|srv-rmm|srv-altogarcas|srv-mon|srv-web"}[7d]))
                  unless
                  group by (instance) (up{job="integrations/unix",instance=~"srv-vpn|srv-rmm|srv-altogarcas|srv-mon|srv-web"} == 1)
                )
                unless on (instance)
                max by (instance, vm, hypervisor) (
                  label_replace(label_replace(
                    max by (instance, guest_host, vm) (last_over_time(hypervisor_vm_info{job="integrations/hypervisor"}[1h])),
                    "hypervisor", "$1", "instance", "(.+)"), "instance", "$1", "guest_host", "(.+)")
                )
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            queryType: expression
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          runbook_url: https://github.com/DEV-ASSESSORIA-TECH/grafana/blob/main/docs/alerts/LIN-101.md
          __dashboardUid__: servers-linux
          __panelId__: "352"
          summary: 'Servidor Linux {{ $labels.instance }} sem métricas'
          description: |-
            O servidor {{ $labels.instance }} (classificado como crítico) parou de enviar métricas há mais de 5 minutos.

            Possíveis causas: servidor desligado ou travado, Grafana Alloy parado, falha de rede até o monitoramento.

            Se a VM ou o hipervisor estiverem fora, este alerta fica inibido pelo alerta deles.
            Servidor desativado de propósito some deste alerta depois de 7 dias (ou silencie).
        labels:
          alert_code: LIN-101
          alvo: '{{ with $$labels.instance }}{{ . }}{{ end }}'
          severity: critical
          area: linux
          scope: guest
          dep_hypervisor: '{{ with $$labels.hypervisor }}{{ . | toLower | reReplaceAll "[^a-z0-9_]" "_" }}{{ end }}'
          dep_vm: '{{ with $$labels.vm }}{{ . | toLower | reReplaceAll "[^a-z0-9_]" "_" }}{{ end }}'
        isPaused: false

      - uid: lin-102
        title: '[LIN-102] Servidor Linux sem métricas'
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: |-
                (
                  group by (instance) (max_over_time(up{job="integrations/unix",instance!~"srv-vpn|srv-rmm|srv-altogarcas|srv-mon|srv-web"}[7d]))
                  unless
                  group by (instance) (up{job="integrations/unix",instance!~"srv-vpn|srv-rmm|srv-altogarcas|srv-mon|srv-web"} == 1)
                )
                * on (instance) group_left (vm, hypervisor)
                max by (instance, vm, hypervisor) (
                  label_replace(label_replace(
                    max by (instance, guest_host, vm) (last_over_time(hypervisor_vm_info{job="integrations/hypervisor"}[1h])),
                    "hypervisor", "$1", "instance", "(.+)"), "instance", "$1", "guest_host", "(.+)")
                )
                or
                (
                  group by (instance) (max_over_time(up{job="integrations/unix",instance!~"srv-vpn|srv-rmm|srv-altogarcas|srv-mon|srv-web"}[7d]))
                  unless
                  group by (instance) (up{job="integrations/unix",instance!~"srv-vpn|srv-rmm|srv-altogarcas|srv-mon|srv-web"} == 1)
                )
                unless on (instance)
                max by (instance, vm, hypervisor) (
                  label_replace(label_replace(
                    max by (instance, guest_host, vm) (last_over_time(hypervisor_vm_info{job="integrations/hypervisor"}[1h])),
                    "hypervisor", "$1", "instance", "(.+)"), "instance", "$1", "guest_host", "(.+)")
                )
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            queryType: expression
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          runbook_url: https://github.com/DEV-ASSESSORIA-TECH/grafana/blob/main/docs/alerts/LIN-102.md
          __dashboardUid__: servers-linux
          __panelId__: "352"
          summary: 'Servidor Linux {{ $labels.instance }} sem métricas'
          description: |-
            O servidor {{ $labels.instance }} parou de enviar métricas há mais de 5 minutos.

            Possíveis causas: servidor desligado ou travado, Grafana Alloy parado, falha de rede até o monitoramento.
            Servidor desativado de propósito some deste alerta depois de 7 dias (ou silencie).
        labels:
          alert_code: LIN-102
          alvo: '{{ with $$labels.instance }}{{ . }}{{ end }}'
          severity: warning
          area: linux
          scope: guest
          dep_hypervisor: '{{ with $$labels.hypervisor }}{{ . | toLower | reReplaceAll "[^a-z0-9_]" "_" }}{{ end }}'
          dep_vm: '{{ with $$labels.vm }}{{ . | toLower | reReplaceAll "[^a-z0-9_]" "_" }}{{ end }}'
        isPaused: false

      - uid: lin-110
        title: '[LIN-110] Unidade systemd em falha'
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: |-
                (
                  node_systemd_unit_state{job="integrations/unix",state="failed",name!~"fwupd.*"} == 1
                )
                * on (instance) group_left (vm, hypervisor)
                max by (instance, vm, hypervisor) (
                  label_replace(label_replace(
                    max by (instance, guest_host, vm) (last_over_time(hypervisor_vm_info{job="integrations/hypervisor"}[1h])),
                    "hypervisor", "$1", "instance", "(.+)"), "instance", "$1", "guest_host", "(.+)")
                )
                or
                (
                  node_systemd_unit_state{job="integrations/unix",state="failed",name!~"fwupd.*"} == 1
                )
                unless on (instance)
                max by (instance, vm, hypervisor) (
                  label_replace(label_replace(
                    max by (instance, guest_host, vm) (last_over_time(hypervisor_vm_info{job="integrations/hypervisor"}[1h])),
                    "hypervisor", "$1", "instance", "(.+)"), "instance", "$1", "guest_host", "(.+)")
                )
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            queryType: expression
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          runbook_url: https://github.com/DEV-ASSESSORIA-TECH/grafana/blob/main/docs/alerts/LIN-110.md
          __dashboardUid__: servers-linux
          __panelId__: "380"
          summary: 'Unidade {{ $labels.name }} em falha em {{ $labels.instance }}'
          description: |-
            A unidade systemd {{ $labels.name }} está em estado failed em {{ $labels.instance }}.

            Verifique com: systemctl status {{ $labels.name }} e journalctl -u {{ $labels.name }}.
            Unidades fwupd (atualização de firmware) ficam de fora: falham sempre em VM.
        labels:
          alert_code: LIN-110
          alvo: '{{ with $$labels.instance }}{{ . }}{{ end }}{{ with $$labels.name }} · {{ . }}{{ end }}'
          severity: warning
          area: linux
          scope: guest
          dep_hypervisor: '{{ with $$labels.hypervisor }}{{ . | toLower | reReplaceAll "[^a-z0-9_]" "_" }}{{ end }}'
          dep_vm: '{{ with $$labels.vm }}{{ . | toLower | reReplaceAll "[^a-z0-9_]" "_" }}{{ end }}'
        isPaused: false

      - uid: lin-120
        title: '[LIN-120] Servidor Linux reiniciado'
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: |-
                (
                  time() - node_boot_time_seconds{job="integrations/unix"}
                )
                * on (instance) group_left (vm, hypervisor)
                max by (instance, vm, hypervisor) (
                  label_replace(label_replace(
                    max by (instance, guest_host, vm) (last_over_time(hypervisor_vm_info{job="integrations/hypervisor"}[1h])),
                    "hypervisor", "$1", "instance", "(.+)"), "instance", "$1", "guest_host", "(.+)")
                )
                or
                (
                  time() - node_boot_time_seconds{job="integrations/unix"}
                )
                unless on (instance)
                max by (instance, vm, hypervisor) (
                  label_replace(label_replace(
                    max by (instance, guest_host, vm) (last_over_time(hypervisor_vm_info{job="integrations/hypervisor"}[1h])),
                    "hypervisor", "$1", "instance", "(.+)"), "instance", "$1", "guest_host", "(.+)")
                )
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            queryType: expression
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 900
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          runbook_url: https://github.com/DEV-ASSESSORIA-TECH/grafana/blob/main/docs/alerts/LIN-120.md
          __dashboardUid__: servers-linux
          __panelId__: "346"
          summary: 'Servidor {{ $labels.instance }} reiniciado'
          description: |-
            O servidor {{ $labels.instance }} foi ligado há menos de 15 minutos.

            Registro informativo. Se o reinício não foi planejado, verifique o journal do boot anterior (journalctl -b -1).
        labels:
          alert_code: LIN-120
          alvo: '{{ with $$labels.instance }}{{ . }}{{ end }}'
          severity: info
          area: linux
          scope: guest
          dep_hypervisor: '{{ with $$labels.hypervisor }}{{ . | toLower | reReplaceAll "[^a-z0-9_]" "_" }}{{ end }}'
          dep_vm: '{{ with $$labels.vm }}{{ . | toLower | reReplaceAll "[^a-z0-9_]" "_" }}{{ end }}'
        isPaused: false

      - uid: lin-130
        title: '[LIN-130] OOM killer acionado'
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 7200
              to: 0
            datasourceUid: loki
            model:
              editorMode: code
              queryType: instant
              expr: |-
                sum by (host) (count_over_time(
                  {job="systemd-journal"} |~ "Out of memory: Killed process|invoked oom-killer"
                  [15m]
                ))
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            queryType: expression
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          runbook_url: https://github.com/DEV-ASSESSORIA-TECH/grafana/blob/main/docs/alerts/LIN-130.md
          __dashboardUid__: servers-linux
          __panelId__: "307"
          summary: 'OOM killer acionado em {{ $labels.host }}'
          description: |-
            O kernel de {{ $labels.host }} matou um processo por falta de memória nos últimos 15 minutos.

            Veja qual processo morreu: journalctl -k | grep -i "out of memory". Aumente a memória da VM ou o limite do serviço.
        labels:
          alert_code: LIN-130
          alvo: '{{ with $$labels.host }}{{ . }}{{ end }}'
          severity: warning
          area: linux
          scope: guest
          dep_vm: '{{ with $$labels.host }}{{ . | toLower | reReplaceAll "[^a-z0-9_]" "_" }}{{ end }}'
        isPaused: false

      - uid: lin-201
        title: '[LIN-201] Filesystem Linux acima de 85%'
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: |-
                (
                  100 * (1 - node_filesystem_avail_bytes{job="integrations/unix",fstype=~"ext4|xfs|btrfs|vfat"} / node_filesystem_size_bytes{job="integrations/unix",fstype=~"ext4|xfs|btrfs|vfat"})
                )
                * on (instance) group_left (vm, hypervisor)
                max by (instance, vm, hypervisor) (
                  label_replace(label_replace(
                    max by (instance, guest_host, vm) (last_over_time(hypervisor_vm_info{job="integrations/hypervisor"}[1h])),
                    "hypervisor", "$1", "instance", "(.+)"), "instance", "$1", "guest_host", "(.+)")
                )
                or
                (
                  100 * (1 - node_filesystem_avail_bytes{job="integrations/unix",fstype=~"ext4|xfs|btrfs|vfat"} / node_filesystem_size_bytes{job="integrations/unix",fstype=~"ext4|xfs|btrfs|vfat"})
                )
                unless on (instance)
                max by (instance, vm, hypervisor) (
                  label_replace(label_replace(
                    max by (instance, guest_host, vm) (last_over_time(hypervisor_vm_info{job="integrations/hypervisor"}[1h])),
                    "hypervisor", "$1", "instance", "(.+)"), "instance", "$1", "guest_host", "(.+)")
                )
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            queryType: expression
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 85
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          runbook_url: https://github.com/DEV-ASSESSORIA-TECH/grafana/blob/main/docs/alerts/LIN-201.md
          __dashboardUid__: servers-linux
          __panelId__: "353"
          summary: '{{ $labels.mountpoint }} de {{ $labels.instance }} acima de 85% de uso'
          description: |-
            O filesystem {{ $labels.mountpoint }} de {{ $labels.instance }} está com {{ with $values.A }}{{ humanize .Value }}{{ end }}% de uso.

            Verifique logs, imagens e volumes Docker antigos (docker system df) ou aumente o disco virtual.
        labels:
          alert_code: LIN-201
          alvo: '{{ with $$labels.instance }}{{ . }}{{ end }}{{ with $$labels.mountpoint }} · {{ . }}{{ end }}'
          severity: warning
          area: linux
          scope: guest
          dep_hypervisor: '{{ with $$labels.hypervisor }}{{ . | toLower | reReplaceAll "[^a-z0-9_]" "_" }}{{ end }}'
          dep_vm: '{{ with $$labels.vm }}{{ . | toLower | reReplaceAll "[^a-z0-9_]" "_" }}{{ end }}'
        isPaused: false

      - uid: lin-202
        title: '[LIN-202] Filesystem Linux acima de 95%'
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: |-
                (
                  100 * (1 - node_filesystem_avail_bytes{job="integrations/unix",fstype=~"ext4|xfs|btrfs|vfat"} / node_filesystem_size_bytes{job="integrations/unix",fstype=~"ext4|xfs|btrfs|vfat"})
                )
                * on (instance) group_left (vm, hypervisor)
                max by (instance, vm, hypervisor) (
                  label_replace(label_replace(
                    max by (instance, guest_host, vm) (last_over_time(hypervisor_vm_info{job="integrations/hypervisor"}[1h])),
                    "hypervisor", "$1", "instance", "(.+)"), "instance", "$1", "guest_host", "(.+)")
                )
                or
                (
                  100 * (1 - node_filesystem_avail_bytes{job="integrations/unix",fstype=~"ext4|xfs|btrfs|vfat"} / node_filesystem_size_bytes{job="integrations/unix",fstype=~"ext4|xfs|btrfs|vfat"})
                )
                unless on (instance)
                max by (instance, vm, hypervisor) (
                  label_replace(label_replace(
                    max by (instance, guest_host, vm) (last_over_time(hypervisor_vm_info{job="integrations/hypervisor"}[1h])),
                    "hypervisor", "$1", "instance", "(.+)"), "instance", "$1", "guest_host", "(.+)")
                )
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            queryType: expression
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 95
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations:
          runbook_url: https://github.com/DEV-ASSESSORIA-TECH/grafana/blob/main/docs/alerts/LIN-202.md
          __dashboardUid__: servers-linux
          __panelId__: "353"
          summary: '{{ $labels.mountpoint }} de {{ $labels.instance }} acima de 95% de uso'
          description: |-
            O filesystem {{ $labels.mountpoint }} de {{ $labels.instance }} está com {{ with $values.A }}{{ humanize .Value }}{{ end }}% de uso.

            Com o filesystem cheio, serviços e bancos de dados param de gravar. Libere espaço imediatamente.
        labels:
          alert_code: LIN-202
          alvo: '{{ with $$labels.instance }}{{ . }}{{ end }}{{ with $$labels.mountpoint }} · {{ . }}{{ end }}'
          severity: critical
          area: linux
          scope: guest
          dep_hypervisor: '{{ with $$labels.hypervisor }}{{ . | toLower | reReplaceAll "[^a-z0-9_]" "_" }}{{ end }}'
          dep_vm: '{{ with $$labels.vm }}{{ . | toLower | reReplaceAll "[^a-z0-9_]" "_" }}{{ end }}'
        isPaused: false

      - uid: lin-203
        title: '[LIN-203] Filesystem Linux enche em 24 horas'
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: |-
                (
                  predict_linear(node_filesystem_avail_bytes{job="integrations/unix",fstype=~"ext4|xfs|btrfs|vfat"}[6h], 24 * 3600) < 0
                  and on (instance, mountpoint)
                  100 * (1 - node_filesystem_avail_bytes{job="integrations/unix",fstype=~"ext4|xfs|btrfs|vfat"} / node_filesystem_size_bytes{job="integrations/unix",fstype=~"ext4|xfs|btrfs|vfat"}) > 70
                )
                * on (instance) group_left (vm, hypervisor)
                max by (instance, vm, hypervisor) (
                  label_replace(label_replace(
                    max by (instance, guest_host, vm) (last_over_time(hypervisor_vm_info{job="integrations/hypervisor"}[1h])),
                    "hypervisor", "$1", "instance", "(.+)"), "instance", "$1", "guest_host", "(.+)")
                )
                or
                (
                  predict_linear(node_filesystem_avail_bytes{job="integrations/unix",fstype=~"ext4|xfs|btrfs|vfat"}[6h], 24 * 3600) < 0
                  and on (instance, mountpoint)
                  100 * (1 - node_filesystem_avail_bytes{job="integrations/unix",fstype=~"ext4|xfs|btrfs|vfat"} / node_filesystem_size_bytes{job="integrations/unix",fstype=~"ext4|xfs|btrfs|vfat"}) > 70
                )
                unless on (instance)
                max by (instance, vm, hypervisor) (
                  label_replace(label_replace(
                    max by (instance, guest_host, vm) (last_over_time(hypervisor_vm_info{job="integrations/hypervisor"}[1h])),
                    "hypervisor", "$1", "instance", "(.+)"), "instance", "$1", "guest_host", "(.+)")
                )
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            queryType: expression
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
