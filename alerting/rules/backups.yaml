# Regras de alerta de backups (job integrations/backup). Codigos em contracts/alerts/codes.yml.
# Genericas: nenhum horario ou backup aparece aqui. O atraso usa o que cada backup publica: o prazo do proximo
# sucesso (backup_success_due_timestamp_seconds) ou, sem prazo, o intervalo esperado
# (backup_expected_interval_seconds); as consultas comparam serie a serie (instance, service, backup_id).
# Severidade: backup com criticality=baixa (backup_info) desce um nivel. Esperados: secao backups do catalogo.yml.
# Contrato dos dados: contracts/prometheus/backup.yml.
# Labels: escrever $$labels (o provisionamento interpola variaveis de ambiente nos labels).
# Annotations e consultas nao sao interpoladas: nelas, $labels.
# VM e hipervisor vem do inventario (receita guest_join): com a VM ou o host fora, estes alertas ficam inibidos.
apiVersion: 1
groups:
  - orgId: 1
    name: backups-1m
    folder: INFRA
    interval: 1m
    rules:
      - uid: bkp-101
        title: '[BKP-101] Backup muito atrasado'
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: |-
                (
                  (
                    (
                      (time() - backup_last_success_timestamp_seconds{job="integrations/backup"})
                      and on (instance, service, backup_id)
                      (
                        (time() - backup_success_due_timestamp_seconds{job="integrations/backup"})
                          > on (instance, service, backup_id)
                        ((backup_last_attempt_duration_seconds{job="integrations/backup"} * 1.5 + 1800 or backup_success_due_timestamp_seconds{job="integrations/backup"} * 0 + 1800) + backup_expected_interval_seconds{job="integrations/backup"})
                      )
                    )
                    or
                    (
                      ((time() - backup_last_success_timestamp_seconds{job="integrations/backup"}) > on (instance, service, backup_id) 2 * backup_expected_interval_seconds{job="integrations/backup"})
                      unless on (instance, service, backup_id)
                      backup_success_due_timestamp_seconds{job="integrations/backup"}
                    )
                  )
                  * on (instance, service, backup_id) group_left (criticality)
                  group by (instance, service, backup_id, criticality) (backup_info{job="integrations/backup"})
                  or
                  (
                    (
                      (time() - backup_last_success_timestamp_seconds{job="integrations/backup"})
                      and on (instance, service, backup_id)
                      (
                        (time() - backup_success_due_timestamp_seconds{job="integrations/backup"})
                          > on (instance, service, backup_id)
                        ((backup_last_attempt_duration_seconds{job="integrations/backup"} * 1.5 + 1800 or backup_success_due_timestamp_seconds{job="integrations/backup"} * 0 + 1800) + backup_expected_interval_seconds{job="integrations/backup"})
                      )
                    )
                    or
                    (
                      ((time() - backup_last_success_timestamp_seconds{job="integrations/backup"}) > on (instance, service, backup_id) 2 * backup_expected_interval_seconds{job="integrations/backup"})
                      unless on (instance, service, backup_id)
                      backup_success_due_timestamp_seconds{job="integrations/backup"}
                    )
                  )
                  unless on (instance, service, backup_id)
                  group by (instance, service, backup_id) (backup_info{job="integrations/backup"})
                )
                * on (instance) group_left (vm, hypervisor)
                max by (instance, vm, hypervisor) (
                  label_replace(label_replace(
                    max by (instance, guest_host, vm) (last_over_time(hypervisor_vm_info{job="integrations/hypervisor"}[1h])),
                    "hypervisor", "$1", "instance", "(.+)"), "instance", "$1", "guest_host", "(.+)")
                )
                or
                (
                  (
                    (
                      (time() - backup_last_success_timestamp_seconds{job="integrations/backup"})
                      and on (instance, service, backup_id)
                      (
                        (time() - backup_success_due_timestamp_seconds{job="integrations/backup"})
                          > on (instance, service, backup_id)
                        ((backup_last_attempt_duration_seconds{job="integrations/backup"} * 1.5 + 1800 or backup_success_due_timestamp_seconds{job="integrations/backup"} * 0 + 1800) + backup_expected_interval_seconds{job="integrations/backup"})
                      )
                    )
                    or
                    (
                      ((time() - backup_last_success_timestamp_seconds{job="integrations/backup"}) > on (instance, service, backup_id) 2 * backup_expected_interval_seconds{job="integrations/backup"})
                      unless on (instance, service, backup_id)
                      backup_success_due_timestamp_seconds{job="integrations/backup"}
                    )
                  )
                  * on (instance, service, backup_id) group_left (criticality)
                  group by (instance, service, backup_id, criticality) (backup_info{job="integrations/backup"})
                  or
                  (
                    (
                      (time() - backup_last_success_timestamp_seconds{job="integrations/backup"})
                      and on (instance, service, backup_id)
                      (
                        (time() - backup_success_due_timestamp_seconds{job="integrations/backup"})
                          > on (instance, service, backup_id)
                        ((backup_last_attempt_duration_seconds{job="integrations/backup"} * 1.5 + 1800 or backup_success_due_timestamp_seconds{job="integrations/backup"} * 0 + 1800) + backup_expected_interval_seconds{job="integrations/backup"})
                      )
                    )
                    or
                    (
                      ((time() - backup_last_success_timestamp_seconds{job="integrations/backup"}) > on (instance, service, backup_id) 2 * backup_expected_interval_seconds{job="integrations/backup"})
                      unless on (instance, service, backup_id)
                      backup_success_due_timestamp_seconds{job="integrations/backup"}
                    )
                  )
                  unless on (instance, service, backup_id)
                  group by (instance, service, backup_id) (backup_info{job="integrations/backup"})
                )
                unless on (instance)
                max by (instance, vm, hypervisor) (
                  label_replace(label_replace(
                    max by (instance, guest_host, vm) (last_over_time(hypervisor_vm_info{job="integrations/hypervisor"}[1h])),
                    "hypervisor", "$1", "instance", "(.+)"), "instance", "$1", "guest_host", "(.+)")
                )
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            queryType: expression
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          runbook_url: https://github.com/DEV-ASSESSORIA-TECH/grafana/blob/main/docs/alerts/BKP-101.md
          summary: 'Backup {{ $labels.service }}/{{ $labels.backup_id }} muito atrasado em {{ $labels.instance }}'
          description: |-
            O backup {{ $labels.service }}/{{ $labels.backup_id }} de {{ $labels.instance }} perdeu mais de uma execução: o último sucesso foi há {{ with $values.A }}{{ humanizeDuration .Value }}{{ end }} (valores de décadas = nunca houve sucesso).

            Com prazo publicado pelo backup: passou do prazo do próximo sucesso, mais a margem, mais um intervalo. Sem prazo: mais que o dobro do intervalo esperado.
            Compare a última tentativa com o último sucesso: tentativas recentes com falha indicam erro no backup; tentativas também antigas indicam que a tarefa agendada não está rodando.
            Backup que publica criticality=baixa entra um nivel abaixo.
        labels:
          alert_code: BKP-101
          alvo: '{{ with $$labels.instance }}{{ . }}{{ end }}{{ with $$labels.service }} · {{ . }}{{ end }}{{ with $$labels.backup_id }}/{{ . }}{{ end }}'
          severity: '{{ if eq $$labels.criticality "baixa" }}warning{{ else }}critical{{ end }}'
          area: backups
          scope: service
          dep_hypervisor: '{{ with $$labels.hypervisor }}{{ . | toLower | reReplaceAll "[^a-z0-9_]" "_" }}{{ end }}'
          dep_vm: '{{ with $$labels.vm }}{{ . | toLower | reReplaceAll "[^a-z0-9_]" "_" }}{{ end }}'
        isPaused: false

