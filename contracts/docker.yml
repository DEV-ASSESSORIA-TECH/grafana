query_recipes:
  - id: observed_container_identities
    title: Containers representados na metrica last_seen
    promql: count by (instance) (container_last_seen{job="integrations/docker",name!=""})
    unit: count
    dependencies:
      - container_last_seen
    validation: dependencies_in_export; not_executed
    notes:
      - Nao rotular automaticamente como containers running. Inventario de containers parados nao foi comprovado.
  - id: container_cpu_cores
    title: CPU em equivalentes de core
    promql: rate(container_cpu_usage_seconds_total{job="integrations/docker",cpu="total",name!=""}[5m])
    unit: cores
    dependencies:
      - container_cpu_usage_seconds_total
    validation: dependencies_in_export; not_executed
    notes:
      - 'Referencia cAdvisor: contador de segundos de CPU. A taxa pode exceder 1 core; nao e percentual do limite.'
  - id: container_working_set
    title: Working set por container
    promql: container_memory_working_set_bytes{job="integrations/docker",name!=""}
    unit: bytes
    dependencies:
      - container_memory_working_set_bytes
    validation: dependencies_in_export; not_executed
    notes: []
  - id: container_memory_usage
    title: Uso de memoria incluindo cache contabilizado
    promql: container_memory_usage_bytes{job="integrations/docker",name!=""}
    unit: bytes
    dependencies:
      - container_memory_usage_bytes
    validation: dependencies_in_export; not_executed
    notes: []
  - id: container_network_receive
    title: Entrada por interface do container
    promql: 8 * rate(container_network_receive_bytes_total{job="integrations/docker",name!=""}[5m])
    unit: bits_per_second
    dependencies:
      - container_network_receive_bytes_total
    validation: dependencies_in_export; not_executed
    notes: []
  - id: container_network_transmit
    title: Saida por interface do container
    promql: 8 * rate(container_network_transmit_bytes_total{job="integrations/docker",name!=""}[5m])
    unit: bits_per_second
    dependencies:
      - container_network_transmit_bytes_total
    validation: dependencies_in_export; not_executed
    notes: []
  - id: container_disk_reads
    title: Leitura por container e device
    promql: rate(container_fs_reads_bytes_total{job="integrations/docker",name!=""}[5m])
    unit: bytes_per_second
    dependencies:
      - container_fs_reads_bytes_total
    validation: dependencies_in_export; not_executed
    notes:
      - Nao agregar camadas de device sem curadoria.
  - id: container_disk_writes
    title: Escrita por container e device
    promql: rate(container_fs_writes_bytes_total{job="integrations/docker",name!=""}[5m])
    unit: bytes_per_second
    dependencies:
      - container_fs_writes_bytes_total
    validation: dependencies_in_export; not_executed
    notes: []
  - id: container_scrape_error
    title: Erro de coleta de containers
    promql: container_scrape_error{job="integrations/docker"}
    unit: boolean
    dependencies:
      - container_scrape_error
    validation: dependencies_in_export; not_executed
    notes:
      - Up=1 nao basta para garantir ausencia de erros internos do exporter.
limitations:
  - Metricas cadvisor_* e container_* confirmam CPU, memoria, rede e I/O por container. A hipotese anterior de coleta
    apenas do daemon foi descartada.
  - 8 hosts e 21 identidades de containers neste snapshot; nao sao um inventario definitivo de containers ligados/desligados
    de toda a infraestrutura.
  - O host de monitoramento nao aparece no job Docker deste export; detalhe no inventario privado. Nao foi inferida
    a causa.
  - Nao assumir que a ausencia de um container cAdvisor separado elimina o cAdvisor embarcado no Alloy. A configuracao
    Alloy nao foi lida neste pacote.
  - container_fs_usage_bytes, container_fs_limit_bytes e container_spec_cpu_quota nao foram observadas.
  - Limites de memoria/CPU nao existem para todas as identidades observadas; nao preencher ausencias com zero.
  - Nao inventar mapeamento de container_health_state sem validar a enumeracao da versao em execucao.
  - Os labels Compose de metricas sao longos e diferentes dos labels simplificados usados em logs Loki. Este contrato
    nao cobre logs.
  - O dashboard 15798 nao foi validado painel a painel; os nomes e labels reais estao documentados para adaptacao.
change_policy:
  baseline_counts_are_fixed_requirements: false
  require_new_metrics_before_using_in_dashboard: true
  preserve_raw_labels: true
  alloy_changes_applied: false
query_policy:
  numerically_validated: false
  promql_parser_validation: not_performed
  static_metric_dependencies_checked: true
  documentation_sources:
    - prometheus_functions
  note: As receitas usam semantica padrao onde conhecida; o catalogo preserva a ausencia de TYPE/HELP do exporter
    em execucao.
