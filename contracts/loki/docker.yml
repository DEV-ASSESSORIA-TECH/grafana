schema_version: 1
kind: loki_log_contract
version: 0.2.0
status: observed_baseline
observed_date: '2026-11-04'
source: Alloy Linux / loki.source.docker
job: docker
identity:
  required_labels:
  - job
  - host
  observed_labels:
  - compose_project
  - compose_service
  - container
  - host
  - job
  - service
  - service_name
  - stream
expected_configuration:
  labels:
  - container
  - compose_project
  - compose_service
  - stream
  collection: Contêineres descobertos por Docker socket.
  rate_limit: 50 linhas/s por container; burst 200; excedentes descartados.
limitations:
- Ausencia de um container nos fluxos de 24h nao prova que sua coleta esteja desativada.
- Identidade de container exige host + container para evitar colisao entre servidores.
