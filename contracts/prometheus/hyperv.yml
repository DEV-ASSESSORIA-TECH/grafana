identity:
  target_key:
    - job
    - instance
  instance_means: hypervisor_host
  vm_cpu_key:
    - instance
    - vm
    - core
  vm_memory_key:
    - instance
    - vm
  network_key:
    - instance
    - adapter
  storage_key:
    - instance
    - device
  vm_label_is_case_sensitive: true
  native_vm_id_label_observed: false
  guest_join:
    status: implemented_via_inventory
    method: usar hypervisor_vm_info.guest_host do job integrations/hypervisor (ver hypervisor.yml)
    runtime_join_implemented: true
    note: Nao renomear instance do hypervisor como nome do convidado. Disco e rede por VM tambem sao ligados pelo
      inventario (hypervisor_vm_disk_info.device, hypervisor_vm_network_info.adapter).
grafana_variables:
  syntax: Grafana label_values, nao PromQL da API
  instance:
    query: label_values(windows_hyperv_dynamic_memory_vm_physical_bytes{job="integrations/hyperv"}, instance)
    multi: true
    all_value: .*
  vm:
    query: label_values(windows_hyperv_dynamic_memory_vm_physical_bytes{job="integrations/hyperv",instance=~"$instance"},
      vm)
    multi: true
    all_value: .*
    preserve_case: true
