# Arvore de notification policies (recurso unico: este arquivo substitui a arvore inteira no Grafana).
# Contact points referenciados: contracts/alerts/notifications.yml. email-infra e criado na UI e precisa
# existir antes deste arquivo ser aplicado.
apiVersion: 1
policies:
  - orgId: 1
    receiver: email-infra
    group_by:
      - area
      - dep_hypervisor
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      # info: fica visivel no Grafana, nunca notifica
      - receiver: email-infra
        object_matchers:
          - ['severity', '=', 'info']
        mute_time_intervals:
          - sempre
      - receiver: email-infra
        object_matchers:
          - ['severity', '=', 'critical']
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 1h
      - receiver: email-infra
        object_matchers:
          - ['severity', '=', 'warning']
        group_wait: 1m
        group_interval: 10m
        repeat_interval: 12h
